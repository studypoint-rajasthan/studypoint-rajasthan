<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact - StudyPoint Rajasthan</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            text-align: center;
        }

        header {
            background: #1e3a8a;
            color: white;
            padding: 25px;
        }

        nav {
            background: white;
            padding: 15px;
        }

        nav a {
            text-decoration: none;
            margin: 0 12px;
            color: #1e3a8a;
            font-weight: bold;
        }

        .contact-box {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 10px #ddd;
        }

        input,
        textarea {
            width: 90%;
            padding: 12px;
            margin: 10px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        textarea {
            height: 120px;
        }

        button {
            background: #1e3a8a;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 7px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>📞 StudyPoint Rajasthan</h1>
        <p>Contact Us</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="notes.html">Notes</a>
        <a href="courses.html">Courses</a>
        <a href="updates.html">Updates</a>
        <a href="contact.html">Contact</a>
    </nav>

    <div class="contact-box">

        <h1>📩 Contact Us</h1>

        <form>
            <input type="text" placeholder="Your Name" required>

            <input type="email" placeholder="Your Email" required>

            <textarea placeholder="Your Message" required></textarea>

            <br>

            <button type="submit">Send Message</button>
        </form>

    </div>

</body>
</html>
